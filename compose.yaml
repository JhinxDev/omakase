# docker compose stack for self-hosting Omakase as a stateless BYOK web counter.
#
# Drop this in /opt/stacks/omakase/ on CT 101, then `docker compose up -d`.
# Visitors supply a request-local LLM key per menu. Nothing is stored in a
# database, cookie, or server keyring, and there is no shared provider key
# or MAL client ID.
#
# Proxy https://omakase.jhinx.dev -> http://<CT-IP>:8765 in NPM.

services:
  omakase:
    container_name: omakase
    image: ghcr.io/jhinxdev/omakase:latest
    build:
      context: .
      args:
        OMAKASE_SOURCE_COMMIT: ${OMAKASE_SOURCE_COMMIT:-development}
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      OMAKASE_PUBLIC_HOSTED: "true"
      OMAKASE_TRUST_PROXY: "true"
      OMAKASE_SOURCE_COMMIT: ${OMAKASE_SOURCE_COMMIT:-development}
      OMAKASE_PUBLIC_URL: ${OMAKASE_PUBLIC_URL:-https://omakase.jhinx.dev}
      OMAKASE_OPENWEBUI_ALLOWED_ORIGINS: ${OMAKASE_OPENWEBUI_ALLOWED_ORIGINS:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
