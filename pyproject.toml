[project]
name = "omakase"
version = "2.2.0"
description = "An LLM-powered sommelier for anime. Connect any list, point it at any LLM, get a tasting menu of recommendations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JhinxDev" }]
keywords = ["anime", "recommendations", "llm", "anilist", "myanimelist", "ai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
]

dependencies = [
    "click>=8.5.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "pydantic>=2.14.4",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[project.urls]
Homepage = "https://github.com/JhinxDev/omakase"
Repository = "https://github.com/JhinxDev/omakase"
Issues = "https://github.com/JhinxDev/omakase/issues"

[project.scripts]
omakase = "omakase.cli:cli"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omakase = [
    "web/templates/*.html",
    "web/static/*",
    "web/static/generated/*",
    "web/static/logos/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
