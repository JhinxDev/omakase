<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e7">
  <title>{% block title %}Omakase Lite{% endblock %}</title>
  <link rel="stylesheet" href="/static/account.css?v={{ account_asset_version }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <script src="/static/account_state.js?v={{ account_asset_version }}" defer></script>
  <script src="/static/account.js?v={{ account_asset_version }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="account-nav">
    <a class="wordmark" href="/"><img src="/static/omakase-mark.svg" width="28" height="28" alt=""><span>Omakase</span><span class="edition">Lite</span></a>
    <nav aria-label="Account">
      <a href="/">New menu</a>
      {% if user %}
        <a href="/account">My counter</a>
        {% if user.role == "admin" %}<a href="/account/admin/requests">Invitations</a>{% endif %}
      {% else %}
        <a href="/account/login">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
</body>
</html>
